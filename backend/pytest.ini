[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Coverage
# Uncomment for coverage reports:
# --cov=app
# --cov-report=term-missing
# --cov-report=html
# --cov-report=xml

# Markers
markers =
    integration: Integration tests (need API keys)
    slow: Slow running tests
    unit: Fast unit tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio
asyncio_mode = auto

